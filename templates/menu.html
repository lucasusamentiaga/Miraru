<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/static/icon.ico">
<title>Miraru</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;color:#e2e2e8;font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0}
#glow{position:fixed;inset:0;z-index:1;pointer-events:none}

/* UI central */
.ui{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

/* Logo más grande */
.logo-wrap{margin-bottom:14px;opacity:0;animation:fadeUp 1s .1s cubic-bezier(.16,1,.3,1) forwards}
.logo-wrap img{
  width:clamp(96px,16vh,150px);height:clamp(96px,16vh,150px);
  border-radius:50%;object-fit:cover;
  border:4px solid rgba(167,139,250,.85);
  box-shadow:0 0 0 0 rgba(124,58,237,.6);
  animation:pring 2.8s ease 1.4s infinite;
}
@keyframes pring{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.6)}50%{box-shadow:0 0 0 22px rgba(124,58,237,0)}}

/* SVG título */
#title-svg{width:min(680px,92vw);height:auto;margin-bottom:10px;overflow:visible;
  filter:drop-shadow(0 0 4px rgba(183,148,255,.9)) drop-shadow(0 0 12px rgba(139,92,246,.7)) drop-shadow(0 0 28px rgba(124,58,237,.5)) drop-shadow(0 0 48px rgba(217,70,239,.32));
  animation:neonPulse 2.8s ease-in-out infinite alternate}
@keyframes neonPulse{
  from{filter:drop-shadow(0 0 4px rgba(183,148,255,.85)) drop-shadow(0 0 10px rgba(139,92,246,.6)) drop-shadow(0 0 22px rgba(124,58,237,.4)) drop-shadow(0 0 40px rgba(217,70,239,.28))}
  to{filter:drop-shadow(0 0 7px rgba(183,148,255,1)) drop-shadow(0 0 17px rgba(139,92,246,.85)) drop-shadow(0 0 36px rgba(124,58,237,.6)) drop-shadow(0 0 62px rgba(217,70,239,.45))}
}
@media (prefers-reduced-motion:reduce){#title-svg{animation:none}}
#title-svg text{font-family:"Segoe UI",system-ui,sans-serif;font-weight:800;font-size:76px;letter-spacing:-2px;fill:none;stroke:url(#tg);stroke-width:1.5;stroke-linecap:round}
#title-fill{font-family:"Segoe UI",system-ui,sans-serif;font-weight:800;font-size:76px;letter-spacing:-2px;fill:url(#tgf);opacity:0}

/* Subtítulo */
.subtitle-wrap{height:26px;overflow:hidden;margin-bottom:26px}
.sw{display:inline-block;font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:var(--light,#a78bfa);opacity:0;transform:translateY(100%)}

/* v2.17.1: puertas a los apartados (con el color del tema) */
.puertas{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;width:min(620px,94vw);
  opacity:0;animation:fadeUp .8s .95s cubic-bezier(.16,1,.3,1) forwards}
.puerta{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:16px;text-decoration:none;text-align:left;
  color:var(--fg,#edecf4);background:rgba(var(--accent-rgb,124,58,237),.08);border:1px solid rgba(var(--accent-rgb,124,58,237),.28);
  backdrop-filter:blur(10px);transition:transform .25s cubic-bezier(.22,1,.36,1),border-color .2s,background .2s,box-shadow .25s}
.puerta:hover{transform:translateY(-3px);border-color:rgba(var(--accent-rgb,124,58,237),.7);background:rgba(var(--accent-rgb,124,58,237),.14)}
.puerta:focus-visible{outline:2px solid var(--light,#c4b1ff);outline-offset:3px}
.puerta.principal{background:var(--grad-accent,linear-gradient(135deg,#7c3aed,#a855f7,#d946ef));border-color:transparent;color:#fff;
  box-shadow:0 10px 34px rgba(var(--accent-rgb,124,58,237),.38)}
.puerta.principal:hover{box-shadow:0 14px 44px rgba(var(--accent-rgb,124,58,237),.55)}
.p-ico{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;border-radius:11px;font-size:18px;
  background:rgba(var(--accent-rgb,124,58,237),.16)}
.principal .p-ico{background:rgba(255,255,255,.2);font-size:15px}
.p-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.p-txt b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-txt small{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.p-ir{font-size:18px;transition:transform .2s}.puerta:hover .p-ir{transform:translateX(4px)}
@media (max-width:560px){.puertas{grid-template-columns:1fr 1fr}.puerta.principal{grid-column:1/-1}.ui{padding-top:64px}.sw{font-size:10.5px;letter-spacing:2.5px}}
@media (prefers-reduced-motion:reduce){.puerta,.hc,.p-ir{transition:none}}

/* Stats */
.stats-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadeUp .8s 1.15s cubic-bezier(.16,1,.3,1) forwards}
.stat-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(var(--accent-rgb,124,58,237),.08);border:1px solid rgba(var(--accent-rgb,124,58,237),.22);
  border-radius:99px;padding:4px 12px;font-size:11.5px;color:var(--light,#c4b1ff);backdrop-filter:blur(8px);text-decoration:none}
a.stat-pill:hover{border-color:rgba(var(--accent-rgb,124,58,237),.6)}

/* Continuar */
#home-continue{margin-top:22px;width:min(620px,94vw);display:none;opacity:0;transition:opacity .7s}
.hc-cab{margin-bottom:10px;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--light,#c4b1ff);opacity:.8}
.hc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.hc-grid{grid-template-columns:1fr}}
.hc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer;text-align:left;
  background:rgba(20,16,32,.72);border:1px solid rgba(var(--accent-rgb,124,58,237),.22);backdrop-filter:blur(8px);transition:border-color .2s,transform .2s}
.hc:hover{border-color:rgba(var(--accent-rgb,124,58,237),.6);transform:translateY(-2px)}
.hc img{width:34px;height:48px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#1a1a24}
.hc-i{flex:1;min-width:0}
.hc-n{font-size:12.5px;font-weight:600;color:var(--fg,#edecf4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-s{font-size:10.5px;color:var(--light,#c4b1ff);margin-top:2px;display:flex;gap:6px;align-items:center}
.hc-t{font-size:9px;font-weight:700;letter-spacing:.5px;padding:1px 5px;border-radius:5px;background:rgba(var(--accent-rgb,124,58,237),.18)}
.hc-b{height:3px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.hc-b i{display:block;height:100%;background:var(--accent,#7c3aed);border-radius:99px}
.hc button{background:var(--accent,#7c3aed);color:#fff;border:none;border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:700;cursor:pointer;flex-shrink:0}
.hc button:hover{filter:brightness(1.12)}
.hc button[hidden]{display:none}

/* Lang */
.lang-bar{position:fixed;top:18px;right:18px;z-index:20;display:flex;gap:5px;opacity:0;animation:fadeDown .8s .5s ease forwards}
.lang-btn{background:rgba(15,15,20,.85);border:1px solid rgba(var(--accent-rgb,124,58,237),.3);border-radius:7px;color:var(--light,#a78bfa);padding:5px 9px;font-size:11px;cursor:pointer;backdrop-filter:blur(10px);transition:all .15s}
.lang-btn:hover,.lang-btn.active{background:rgba(var(--accent-rgb,124,58,237),.35);border-color:rgba(var(--accent-rgb,124,58,237),.7);color:#fff}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

/* ── Modo claro ─────────────────────────────────────────────────────────── */
[data-theme=light] body{background:#f0eff8;color:#1e1b2e}
[data-theme=light] .stat-pill{background:rgba(255,255,255,.9);border-color:rgba(79,70,229,.2);color:#1e1b2e}
[data-theme=light] .puerta:not(.principal),[data-theme=light] .hc{background:rgba(255,255,255,.9);color:#1e1b2e}
[data-theme=light] .hc-n{color:#1e1b2e}
[data-theme=light] .lang-btn{background:rgba(255,255,255,.9);border-color:rgba(79,70,229,.2);color:#1e1b2e}
[data-theme=light] .lang-btn:hover,[data-theme=light] .lang-btn.active{background:rgba(79,70,229,.12);border-color:rgba(79,70,229,.5)}
</style>

<body>
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(_){}</script>

<canvas id="bg"></canvas>
<div id="glow"></div>

<div class="lang-bar">
  <button class="lang-btn active" data-lang="es" onclick="setLang('es')">ES</button>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  <button class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
  <button class="lang-btn" data-lang="de" onclick="setLang('de')">DE</button>
  <button class="lang-btn" id="btn-salir" onclick="salirDeMiraru()"
          title="Cierra Miraru por completo (el servidor deja de correr)">⏻ Salir</button>
</div>

<div class="ui">
  <div class="logo-wrap">
    <img src="/static/logo.png" alt="logo" onerror="this.style.display='none'">
  </div>

  <svg id="title-svg" viewBox="0 0 680 90" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tg"  x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#ffffff"/>
        <stop offset="50%"  style="stop-color:var(--light,#a78bfa)"/>
        <stop offset="100%" style="stop-color:var(--accent,#7c3aed)"/>
      </linearGradient>
      <linearGradient id="tgf" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#ffffff"/>
        <stop offset="50%"  style="stop-color:var(--light,#a78bfa)"/>
        <stop offset="100%" style="stop-color:var(--accent,#7c3aed)"/>
      </linearGradient>
    </defs>
    <text id="title-stroke" x="50%" y="76" text-anchor="middle">Miraru</text>
    <text id="title-fill"   x="50%" y="76" text-anchor="middle">Miraru</text>
  </svg>

  <div class="subtitle-wrap" id="sub-wrap"></div>

  <!-- v2.17.1: tres «puertas» (anime, manga, series y pelis) con lo que
       llevas en cada una. Antes: un «Entrar» y dos botones sueltos en una
       esquina, y las cifras mezclaban anime y manga. -->
  <nav class="puertas" aria-label="Apartados">
    <a href="/app" class="puerta principal" id="p-anime">
      <span class="p-ico" aria-hidden="true">▶</span>
      <span class="p-txt"><b id="enter-txt">Anime</b><small id="p-anime-sub">&nbsp;</small></span>
      <span class="p-ir" aria-hidden="true">→</span>
    </a>
    <a href="/manga" class="puerta" id="p-manga">
      <span class="p-ico" aria-hidden="true">📖</span>
      <span class="p-txt"><b>Manga</b><small id="p-manga-sub">&nbsp;</small></span>
    </a>
    <a href="/peliculas" class="puerta" id="p-media">
      <span class="p-ico" aria-hidden="true">🎬</span>
      <span class="p-txt"><b>Series y pelis</b><small id="p-media-sub">&nbsp;</small></span>
    </a>
  </nav>

  <div class="stats-row" id="stats-row"></div>
  <!-- v2.4: widget «Continuar» — gancho diario, solo si hay algo a medias -->
  <div id="home-continue"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
const TX = {
  es:{sub:"ANIME · MANGA · SERIES · PELÍCULAS", enter:"Anime", t:"{n} títulos", w:"{n} viendo", r:"{n} leyendo", c:"{n} completados", cont:"Continuar", mg:"{n} mangas", s:"{n} series", pe:"{n} pelis", vacio:"Empieza tu lista", dia:"{n} día", dias:"{n} días", nov:"Estrenos de la semana", kofi:"Apoyar Miraru"},
  en:{sub:"ANIME · MANGA · SERIES · MOVIES", enter:"Anime", t:"{n} titles", w:"{n} watching", r:"{n} reading", c:"{n} completed", cont:"Continue", mg:"{n} manga", s:"{n} series", pe:"{n} movies", vacio:"Start your list", dia:"{n} day", dias:"{n} days", nov:"This week's releases", kofi:"Support Miraru"},
  fr:{sub:"ANIME · MANGA · SÉRIES · FILMS", enter:"Anime", t:"{n} titres", w:"{n} en cours", r:"{n} en lecture", c:"{n} terminés", cont:"Continuer", mg:"{n} mangas", s:"{n} séries", pe:"{n} films", vacio:"Commencez votre liste", dia:"{n} jour", dias:"{n} jours", nov:"Sorties de la semaine", kofi:"Soutenir Miraru"},
  de:{sub:"ANIME · MANGA · SERIEN · FILME", enter:"Anime", t:"{n} Titel", w:"{n} am Schauen", r:"{n} am Lesen", c:"{n} fertig", cont:"Weiter", mg:"{n} Manga", s:"{n} Serien", pe:"{n} Filme", vacio:"Starte deine Liste", dia:"{n} Tag", dias:"{n} Tage", nov:"Neu diese Woche", kofi:"Miraru unterstützen"},
};
let LANG = 'es';
const T = (k, n = 0) => ((TX[LANG] || TX.es)[k] || k).replace('{n}', n);

// Versión real (antes estaba escrita a mano: "v2.4.0").
fetch('/api/version').then(r => r.json()).then(d => {
  const el = document.getElementById('app-version');
  if (el && d && d.version) el.firstChild.textContent = 'v' + d.version + ' · ';
}).catch(() => {});

async function setLang(l) {
  LANG = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  await fetch('/api/lang', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({lang:l})}).catch(()=>{});
  // Se recarga: así cambia TODO el texto de la página, no solo el título y el botón.
  location.reload();
}

// ── Salir de Miraru ───────────────────────────────────────────────────────────
// Miraru se lanza sin consola, así que este es el modo de apagarlo del todo.
// Sin esto el servidor se quedaría corriendo de fondo sin forma clara de pararlo.
async function salirDeMiraru() {
  if (!(await miraruConfirmar('¿Cerrar Miraru?\n\nSe cerrará el servidor y esta pestaña dejará de funcionar.', {ok: 'Cerrar Miraru', peligro: true})))
    return;
  const btn = document.getElementById('btn-salir');
  if (btn) { btn.disabled = true; btn.textContent = 'Cerrando…'; }
  try {
    await fetch('/api/apagar', {method: 'POST'});
  } catch (_) {
    // El servidor puede morir antes de contestar; es el resultado esperado.
  }
  document.body.innerHTML =
    '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;'
  + 'justify-content:center;gap:10px;font-family:system-ui;color:#a78bfa;text-align:center">'
  + '<div style="font-size:44px">⏻</div>'
  + '<div style="font-size:18px;font-weight:700">Miraru se ha cerrado</div>'
  + '<div style="font-size:13px;color:#6b6b88">Ya puedes cerrar esta pestaña.<br>'
  + 'Para volver a abrirlo, doble clic en <b>Miraru.vbs</b> en la carpeta del proyecto.</div></div>';
}

// ── Canvas interactivo ────────────────────────────────────────────────────────
(function() {
  const cv = document.getElementById('bg');
  const cx = cv.getContext('2d');
  const glow = document.getElementById('glow');
  let W, H, mx = 400, my = 300;

  // Color de las partículas = acento elegido por el usuario (customize.js fija
  // --accent-rgb en :root). Se relee al cambiarlo desde el panel de apariencia.
  let ACC = '167,139,250';
  const leerAcento = () => {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb').trim();
    if (v) ACC = v;
  };
  leerAcento();
  new MutationObserver(leerAcento).observe(document.documentElement,
    {attributes: true, attributeFilter: ['style', 'data-theme']});

  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  window.addEventListener('resize', resize, {passive:true});
  resize();

  window.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    glow.style.background = `radial-gradient(600px circle at ${mx}px ${my}px, rgba(${ACC},.13) 0%, transparent 70%)`;
  }, {passive:true});

  // Partículas — inicializar con posición real del canvas
  const N = 90;
  const ps = Array.from({length: N}, () => {
    const a = Math.random() * .45 + .08;
    return {
      x: Math.random() * (innerWidth  || 1920),
      y: Math.random() * (innerHeight || 1080),
      vx: (Math.random() - .5) * .3,
      vy: -(Math.random() * .35 + .08),
      r:  Math.random() * 1.3 + .3,
      a, ba: a,
    };
  });

  let raf;
  function frame() {
    cx.clearRect(0, 0, W, H);

    // Actualizar y dibujar partículas
    for (const p of ps) {
      const dx = p.x - mx, dy = p.y - my;
      const d2 = dx * dx + dy * dy;
      if (d2 < 130 * 130) {
        const d = Math.sqrt(d2);
        const f = (130 - d) / 130;
        if (d > 0) { p.x += dx / d * f * 2; p.y += dy / d * f * 2; }
        p.a = Math.min(.95, p.ba + f * .8);
      } else {
        p.a += (p.ba - p.a) * .06;
      }
      p.x += p.vx; p.y += p.vy;
      if (p.y < -8)  { p.x = Math.random() * W; p.y = H + 5; }
      if (p.x < 0)   p.x = W;
      if (p.x > W)   p.x = 0;
      cx.beginPath();
      cx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(${ACC},${p.a.toFixed(2)})`;
      cx.fill();
    }

    // Líneas de conexión cerca del cursor (optimizado: sólo las cercanas)
    const near = ps.filter(p => {
      const dx = p.x - mx, dy = p.y - my;
      return dx * dx + dy * dy < 160 * 160;
    });
    for (let i = 0; i < near.length; i++) {
      for (let j = i + 1; j < near.length; j++) {
        const dx = near[i].x - near[j].x, dy = near[i].y - near[j].y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 90 * 90) {
          cx.beginPath();
          cx.moveTo(near[i].x, near[i].y);
          cx.lineTo(near[j].x, near[j].y);
          cx.strokeStyle = `rgba(${ACC},${(.35 * (1 - Math.sqrt(d2) / 90)).toFixed(2)})`;
          cx.lineWidth = .6;
          cx.stroke();
        }
      }
    }

    raf = requestAnimationFrame(frame);
  }
  frame();

  // Pausar animación cuando la pestaña está oculta (ahorro CPU)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else frame();
  });
})();

// ── Subtítulo ─────────────────────────────────────────────────────────────────
function buildSub() {
  const wrap = document.getElementById('sub-wrap');
  const words = T('sub').split(' ');
  wrap.innerHTML = words.map((w, i) => `<span class="sw" id="sw${i}">${w}&nbsp;</span>`).join('');
  if (window.anime) {
    anime({
      targets: '.sw',
      translateY: ['100%', '0%'],
      opacity: [0, 1],
      duration: 550,
      delay: anime.stagger(75, {start: 350}),
      easing: 'cubicBezier(.16,1,.3,1)',
    });
  } else {
    document.querySelectorAll('.sw').forEach((el, i) => {
      setTimeout(() => {
        el.style.transition = 'opacity .5s, transform .5s';
        el.style.opacity = 1;
        el.style.transform = 'translateY(0)';
      }, 350 + i * 75);
    });
  }
}

// ── Título SVG drawable ───────────────────────────────────────────────────────
function animTitle() {
  const s = document.getElementById('title-stroke');
  const f = document.getElementById('title-fill');
  if (!s) return;
  const LEN = 2200;
  s.style.strokeDasharray  = LEN;
  s.style.strokeDashoffset = LEN;
  if (window.anime) {
    anime({
      targets: s,
      strokeDashoffset: [LEN, 0],
      duration: 1700,
      delay: 150,
      easing: 'easeInOutQuad',
      complete() {
        anime({targets: f, opacity: [0, 1], duration: 550, easing: 'easeOutQuad'});
        anime({targets: s, opacity: [1, 0], duration: 350, delay: 250, easing: 'easeInQuad'});
      }
    });
  } else {
    s.style.strokeDashoffset = 0;
    f.style.opacity = 1;
  }
}



// ── Cifras de cada apartado ──────────────────────────────────────────────────
function _pon(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; }
async function loadStats() {
  let html = '';
  try {
    const {animes = []} = await (await fetch('/api/animes/slim')).json();
    const manga = animes.filter(a => a.tipo === 'manga');
    const anime = animes.filter(a => a.tipo !== 'manga');
    const enCurso = (l) => l.filter(a => ['viendo', 'watching'].includes(a.estado_usuario)).length;
    const hechos = animes.filter(a => ['completado', 'completed'].includes(a.estado_usuario)).length;
    _pon('p-anime-sub', anime.length ? T('t', anime.length) + ' · ' + T('w', enCurso(anime)) : T('vacio'));
    _pon('p-manga-sub', manga.length ? T('mg', manga.length) + ' · ' + T('r', enCurso(manga)) : T('vacio'));
    if (hechos) html += `<span class="stat-pill">✓ ${T('c', hechos)}</span>`;
  } catch(_) {}
  try {
    const ms = await (await fetch('/api/media/stats')).json();
    _pon('p-media-sub', ms && ms.total > 0 ? T('s', ms.series) + ' · ' + T('pe', ms.peliculas) : T('vacio'));
  } catch(_) {}
  // Racha de apertura diaria: registra la apertura de hoy y muestra la racha
  try {
    const rk = await (await fetch('/api/streak/checkin', {method: 'POST'})).json();
    if (rk && rk.actual > 0) {
      html += `<span class="stat-pill" title="Días seguidos abriendo Miraru">🔥 ${T(rk.actual === 1 ? 'dia' : 'dias', rk.actual)}</span>`;
    }
  } catch(_) {}
  html += `<a class="stat-pill" href="/novedades">🗓️ ${T('nov')}</a>`;
  html += `<a class="stat-pill" href="https://ko-fi.com/lucasuazz_" target="_blank" rel="noopener" title="Miraru es gratis y sin anuncios">☕ ${T('kofi')}</a>`;
  document.getElementById('stats-row').innerHTML = html;
}

// ── Continuar (anime y manga) ────────────────────────────────────────────────
async function loadContinue() {
  const wrap = document.getElementById('home-continue');
  if (!wrap) return;
  try {
    const r = await fetch('/api/continuar');
    if (!r.ok) return;
    const items = ((await r.json()).animes || []).slice(0, 4);
    if (!items.length) { wrap.style.display = 'none'; return; }
    wrap.innerHTML = '';
    const head = document.createElement('div');
    head.className = 'hc-cab';
    head.textContent = '▶ ' + T('cont');
    const grid = document.createElement('div');
    grid.className = 'hc-grid';
    items.forEach(a => {
      const esManga = a.tipo === 'manga';
      const card = document.createElement('div');
      card.className = 'hc';
      card.onclick = () => location.href = esManga ? '/manga' : '/app';   // cada uno a su apartado
      const img = document.createElement('img');
      img.alt = '';
      miraruPortada(img, a.imagen);
      img.onerror = () => { img.onerror = null; img.removeAttribute('src'); };
      const total = parseInt(a.capitulos) || 0;
      const vistos = a.episodios_vistos || 0;
      const alDia = total > 0 && vistos >= total;          // "12+" en emisión y ya los has visto todos
      const ud = esManga ? 'Cap' : 'Ep';                  // el manga se lee por capítulos
      const info = document.createElement('div'); info.className = 'hc-i';
      const name = document.createElement('div'); name.className = 'hc-n';
      name.textContent = a.nombre; name.title = a.nombre;
      const sub = document.createElement('div'); sub.className = 'hc-s';
      const tag = document.createElement('span'); tag.className = 'hc-t'; tag.textContent = esManga ? 'MANGA' : 'ANIME';
      const nx = document.createElement('span');
      nx.textContent = alDia ? '✓ ' + ud + ' ' + vistos : ud + ' ' + (vistos + 1) + (total ? ' / ' + total : '');
      sub.append(tag, nx);
      info.append(name, sub);
      if (total) {
        const bar = document.createElement('div'); bar.className = 'hc-b';
        const fill = document.createElement('i');
        fill.style.width = Math.min(100, Math.round(vistos * 100 / total)) + '%';
        bar.appendChild(fill);
        info.appendChild(bar);
      }
      const plus = document.createElement('button');
      plus.type = 'button';
      plus.textContent = '+1';
      plus.hidden = alDia;
      plus.setAttribute('aria-label', '+1 ' + a.nombre);
      plus.onclick = async (e) => {
        e.stopPropagation();
        plus.disabled = true;
        try { await fetch('/api/animes/' + encodeURIComponent(a.nombre) + '/plus1', {method: 'POST'}); } catch(_) {}
        loadContinue();
        loadStats();
      };
      card.append(img, info, plus);
      grid.appendChild(card);
    });
    wrap.append(head, grid);
    wrap.style.display = 'block';
    requestAnimationFrame(() => { wrap.style.opacity = '1'; });
  } catch(_) {}
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const {lang} = await (await fetch('/api/setup/status')).json();
    if (lang) LANG = lang;
  } catch(_) {}
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  document.getElementById('enter-txt').textContent = T('enter');
  buildSub();
  animTitle();
  loadStats();
  loadContinue();
  // v2.15: al volver a esta pestaña (p. ej. tras marcar un episodio en AnimeAV1)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { loadContinue(); }
  });
}
init();

// v2.4: Enter entra a la app (salvo si el foco está en un botón/enlace/campo).
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' &&
      !['BUTTON', 'A', 'INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    location.href = '/app';
  }
});
</script>
